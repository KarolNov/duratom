name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # Fails when a generated doc is stale, or a doc snippet or TSDoc example no longer compiles.
      - run: pnpm docs:check
      - run: pnpm build
      # The example imports the built package, so it is checked after the build.
      - run: pnpm --filter duratom-example-todo typecheck
      - run: pnpm --filter duratom-example-todo build
